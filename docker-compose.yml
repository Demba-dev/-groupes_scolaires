name: groupes_scolaires

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-groupes_scolaires}
      POSTGRES_USER: ${DB_USER:-groupe_scolaire}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD doit être défini dans .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-groupe_scolaire} -d ${DB_NAME:-groupes_scolaires}"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    volumes:
      - .:/app
      - media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Interface d'administration PostgreSQL (optionnel)
  # pgadmin:
  #   image: dpage/pgadmin4
  #   restart: unless-stopped
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@exemple.local
  #     PGADMIN_DEFAULT_PASSWORD: admin12345
  #   ports:
  #     - "5050:80"
  #   depends_on:
  #     - db

volumes:
  pgdata:
  media: