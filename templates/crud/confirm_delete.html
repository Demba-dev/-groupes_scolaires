{% extends 'base.html' %}

{% block page_title %}{{ page_title }}{% endblock %}
{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="card shadow-sm mx-auto" style="max-width: 560px;">
  <div class="card-body text-center py-5">
    <i class="bi bi-exclamation-triangle text-warning" style="font-size: 3rem;"></i>
    <h2 class="h5 mt-3">Confirmer la suppression</h2>
    <p class="text-muted">{{ page_title }}.<br>Cette action est irréversible.</p>
    <form method="post">
      {% csrf_token %}
      <div class="d-flex gap-2 justify-content-center">
        <button type="submit" class="btn btn-danger">
          <i class="bi bi-trash3 me-1"></i>Oui, supprimer
        </button>
        <a href="{{ cancel_url }}" class="btn btn-outline-secondary">Annuler</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
