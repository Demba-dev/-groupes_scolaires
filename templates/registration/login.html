{% load static %}<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion · {{ NOM_ECOLE }}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <style>
    body { background: linear-gradient(135deg, #12263f 0%, #1e4d8c 100%); min-height: 100vh; display: flex; align-items: center; }
    .login-card { max-width: 420px; margin: auto; border-radius: 1rem; }
    .login-logo { width: 64px; height: 64px; border-radius: 16px; background: var(--ecole-accent); color: var(--ecole-sidebar-bg); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.6rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card login-card shadow-lg border-0">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="login-logo mx-auto mb-3">GS</div>
          <h1 class="h5 fw-bold mb-1">{{ NOM_ECOLE }}</h1>
          <p class="text-muted small mb-0">République du Mali · École fondamentale</p>
        </div>

        {% if form.errors %}
        <div class="alert alert-danger py-2 small">
          Nom d'utilisateur ou mot de passe incorrect.
        </div>
        {% endif %}

        <form method="post" novalidate>
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">{{ form.username.label }}</label>
            {{ form.username }}
          </div>
          <div class="mb-4">
            <label class="form-label">{{ form.password.label }}</label>
            {{ form.password }}
          </div>
          <button type="submit" class="btn btn-ecole w-100">
            <i class="bi bi-box-arrow-in-right me-1"></i> Se connecter
          </button>
        </form>
      </div>
    </div>
    <p class="text-center text-white-50 small mt-3">Application de gestion scolaire © {% now "Y" %}</p>
  </div>
</body>
</html>
